services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nutriai
      POSTGRES_PASSWORD: nutriai
      POSTGRES_DB: nutriai
    ports:
      # 5433 no host para não conflitar com outro Postgres local
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Cria também o banco dos testes e2e (só na primeira subida do volume).
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  pgdata:
